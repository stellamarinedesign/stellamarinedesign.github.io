<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Not here</title>
<!-- This repo is the root of the site, so this page may also answer for a wrong
     address under any of the apps. Absolute paths, and nothing app-specific. -->
<link rel="icon" type="image/png" href="/images/brand/favicon.png">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/themes.css">
<script>try { if (localStorage.getItem('stella.hub.theme') === 'workshop') document.documentElement.dataset.theme = 'workshop'; } catch (e) { /* dark */ }</script>
<style>
  main { min-height: 100vh; display: grid; place-content: center; justify-items: start; gap: 12px; padding: 24px; }
  h1 { font-family: var(--font-head); font-size: var(--fs-lg); line-height: 1.25; }
  p { color: var(--text2); max-width: 46ch; }
  a.go { display: inline-flex; align-items: center; height: 36px; padding: 0 14px; margin-top: 4px; border: 1px solid var(--border2); border-radius: var(--radius); color: var(--text2); font-weight: 600; text-decoration: none; }
  a.go:hover { background: var(--bg); color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>That page is not here</h1>
  <p>The address may have been mistyped, or the page has moved.</p>
  <a class="go" href="/">Open Hubinator</a>
</main>
</body>
</html>
